# PRJ-1: the root is a workspace of the three packages, not a package itself.
[project]
name = "config-tooling"
version = "0.1.0"
description = "Shared spec checker and Incus test toolkit for the configuration repositories"
# PRJ-4
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
  {include-group = "lint"},
  {include-group = "test"},
]
lint = [
  "ruff>=0.15.2",
  "ty>=0.0.23",
]
test = [
  "pytest>=9.0.2",
  "deploy-gate",
  "incus[fixtures]",
  "spec-check",
]

[tool.uv]
package = false
default-groups = ["dev"]
environments = [
    "platform_machine == 'x86_64' and sys_platform == 'linux'",
]

[tool.uv.workspace]
members = ["deploy-gate", "incus", "spec-check"]

# PRJ-6: the tree is checked by the workspace member, not a submodule.
[tool.uv.sources]
deploy-gate = { workspace = true }
incus = { workspace = true }
spec-check = { workspace = true }

[[tool.uv.index]]
name = "PyPI"
url = "https://pypi.org/simple"
default = true

# TEST-1: the tiers are the `unit` and `integration` markers over every test path.
[tool.pytest.ini_options]
testpaths = ["tests", "spec-check/tests", "incus/tests", "deploy-gate/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["--import-mode=importlib"]
markers = [
    "unit: marks tests as unit tests (fast, no external dependencies)",
    "integration: marks tests as integration tests (require actual system/VM)",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["spec_check", "incus", "deploy_gate"]

[tool.spec-check]
scan = [
    "Makefile",
    "pyproject.toml",
    "incus/pyproject.toml",
    "spec-check/pyproject.toml",
    "deploy-gate/pyproject.toml",
    "README.md",
    "incus/README.md",
    "spec-check/README.md",
    "deploy-gate/README.md",
    "incus/src/**/*.py",
    "incus/tests/**/*.py",
    "spec-check/src/**/*.py",
    "spec-check/tests/**/*.py",
    "deploy-gate/src/**/*.py",
    "deploy-gate/tests/**/*.py",
    "tests/**/*.py",
]
